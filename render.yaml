services:
  - type: web
    name: pravaah-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "python complete_datetime_fix.py && python create_tables.py && gunicorn app.main:app -c gunicorn.conf.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DATABASE_URL
        fromDatabase:
          name: pravaah_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://pravaah-frontend.onrender.com
  - type: worker
    name: general-worker
    env: python
    plan: free
    rootDir: backend
    startCommand: "python ./worker.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pravaah_db
          property: connectionString
  - type: worker
    name: weather-worker
    env: python
    plan: free
    rootDir: backend
    startCommand: "python ./weather_worker.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pravaah_db
          property: connectionString
  - type: worker
    name: peer-notification-worker
    env: python
    plan: free
    rootDir: backend
    startCommand: "python ./peer_notif_worker.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pravaah_db
          property: connectionString
  - type: worker
    name: ai-worker
    env: python
    plan: free
    rootDir: ai
    startCommand: "pip install -r requirements.txt && python worker.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pravaah_db
          property: connectionString
databases:
  - name: pravaah_db
    plan: free