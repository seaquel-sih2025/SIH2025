services:
  - type: web
    name: pravaah-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "python create_tables.py create || true; gunicorn app.main:app -c gunicorn.conf.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DATABASE_URL
        fromDatabase:
          name: pravaah_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://pravaah-frontend.onrender.com
      - key: RABBITMQ_URL
        sync: false
      - key: WEATHERAPI_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
  - type: worker
    name: general-worker
    env: python
    plan: free
    rootDir: backend
    startCommand: "python ./worker.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pravaah_db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
  - type: worker
    name: weather-worker
    env: python
    plan: free
    rootDir: backend
    startCommand: "python ./weather_worker.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pravaah_db
          property: connectionString
      - key: WEATHERAPI_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
  - type: worker
    name: peer-notification-worker
    env: python
    plan: free
    rootDir: backend
    startCommand: "python ./peer_notif_worker.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pravaah_db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
  - type: worker
    name: ai-worker
    env: python
    plan: free
    rootDir: ai
    startCommand: "pip install -r requirements.txt; python worker.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pravaah_db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
databases:
  - name: pravaah_db
    plan: free