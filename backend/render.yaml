# Render.com deployment configuration
services:
  - type: web
    name: pravaah-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -c gunicorn.conf.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DATABASE_URL
        fromDatabase:
          name: pravaah-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30

  - type: pserv
    name: pravaah-db
    plan: free
    databaseName: pravaah
    user: pravaah_user

databases:
  - name: pravaah-db
    plan: free